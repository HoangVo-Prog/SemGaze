# Derived from configs/flat_ss_lwce.yaml at commit c7e6d75458c46d60bd5f09fa7939741c7d6b5d27
# Uses configs/defaults.yaml missing-field merge; all experiment fields explicit below.
experiment:
  name: intergaze_v3_where_only
  semantic_mode: flat_single_output
  protocol_version: flat-v1
  seed: 42
data:
  dataset: all
  variant: all
  split_root: data/split/all
  images_root: /data/shared/cvpr/hoang/dataset/images_recovered
  annotation_frame: original_image
  unseen_subjects: [7, 8, 9]
  air_unseen_subjects: [JY, SC, YN]
  duration:
    source_field: T
    semantics: dwell_duration
    source_unit: ms
    conversion_to_ms: identity
  fewshot:
    k_values: [1]
    train_k_probabilities: [1.0]
    require_same_subject: true
    require_distinct_support_stimuli: true
    exclude_query_stimulus: true
    preserve_input_order: true
model:
  base_model: OpenGVLab/InternVL3_5-8B-HF
  backend: huggingface
  initialization_adapter: null
  adapter_load_mode: fresh
  merge_adapter_for_training: false
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  freeze:
    vision_tower: true
    native_multimodal_projector: true
    base_lm_outside_lora: true
    old_vocab_rows: true
where:
  mode: xyd
  end_fix_token: <END_FIX>
  require_atomic_end_fix: true
  support_prompt_style: concise
  coordinates:
    grid_size: 100
    min_value: 0
    max_value: 99
    text_width: 2
    conversion: deepgaze_two_stage_python_round
  duration:
    unit: ms
    bin_width_ms: 1
    min_value: 0
    max_value: 999
    text_width: 3
    non_integer_rounding: nearest_python_round
  context:
    max_k: 10
    max_images_per_episode: 11
    max_total_sequence_length: 8192
    visual_policy: one_448x448_tile_per_image
    overflow_training: resample_supports_same_query_and_k
  supervision:
    support_assistant_labels: ignore
    query_assistant_labels: supervise
    supervise_query_end_fix: true
    output_hidden_states: false
    use_cache: false
state:
  readout_layer: final_language_model_layer
  readout_position: query_end_fix_token_position
  projector:
    type: linear_layernorm
    input_dim: model_hidden_size
    output_dim: model_hidden_size
  detach_where_states: false
  direct_state_positions:
    attention_mask: 1
    label: -100
semantic:
  mode: flat_single_output
  replay_support_context: false
  consume_full_chronological_states: true
  use_gold_why_groups: true
  predict_groups: false
  semantic_special_tokens: false
  output_format: flat_lines
  parser: strict_rule_based
  loss: response_token_mean_nll
checkpoint_loading:
  resume_from: null
  init_from: null
training:
  scheduled_sampling:
    enabled: false
    probability: 0.3
    max_probability: 0.3
    warmup_ratio: 0.1
    sampling_strategy: greedy_single_fixation
    target_tasks: [where]
    loss_mix: 0.5
    max_new_tokens: 48
    seed: 2027
  late_fixation_ce:
    enabled: false
    mode: late_only
    alpha: 0.5
    threshold: 5
  lambda_where: 1.0
  lambda_sem: 0.0
  optimizer: AdamW
  learning_rate: 0.0001
  scheduler: cosine
  warmup_ratio: 0.1
  precision: bf16
  num_train_epochs: 2
  max_steps: null
  max_episode_retries: 1000
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  gradient_diagnostics_every: 0
  length_aware_batching: true
  reuse_query_vision: true
  cache_preprocessed_images: true
  preprocessing_cache_max_entries: 32
  max_grad_norm: 1.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  backward:
    one_joint_backward: true
    detach_f: false
    detach_r: false
evaluation:
  strategy: 'no'
  eval_epoch: 1
  batch_size: 1
  batch_size_by_k:
    '1': 1
    '5': 1
    '10': 1
  eval_steps: 1000
  draw: 1
  semantic_use_draws: true
  k_values: [1]
  loss_aggregation: episode_mean
  predictions:
    where: true
    semantic: false
    train_batches: 1
    test_scope: all_unseen
    semantic_max_new_tokens: 512
  metrics:
    enabled: true
    split: test
    where:
      scanmatch: true
      multimatch: true
      sed: true
      isp_reference:
        width: 512
        height: 320
        scanmatch_xbins: 16
        scanmatch_ybins: 12
        scanmatch_temp_bin_ms: 50
        scanmatch_threshold: 3.5
        sed_grid_n: 5
      coordinate_adapter: deepgaze_vl_predict_scanpath_round
    probability:
      ll: false
      ig: false
      outcome: B
      mode: deepgaze_fast
      resolution: 100
      normalize_digits: true
      centerbias:
        source: canonical_data
        root: null
        allow_synthetic_fallback: false
    semantic:
      bertscore:
        enabled: false
        package_version: 0.3.13
        lang: en
        model_type: roberta-large
        num_layers: 17
        idf: false
        rescale_with_baseline: false
        use_fast_tokenizer: false
        batch_size: 64
      cider_r:
        enabled: false
        implementation: vendored_authors
        n: 4
        k_r: 0.8
        tokenizer: stanford_ptb_reference
      bleu4:
        enabled: false
      rouge_l:
        enabled: false
      meteor:
        enabled: false
        jar_path: null
        java_bin: java
runtime:
  device: cuda
  output_dir: runs/intergaze_v3_where_only
logging:
  every_steps: 1
  filename: trainer_log.jsonl
checkpoint:
  save_every: 100
  save_at_epoch_end: true
  save_at_end: true
  save_processor_and_tokenizer: true
  save_end_fix_token_id: true
  save_peft_adapter: true
  save_trainable_end_fix_rows: true
  save_projector: true
  save_resolved_config: true
  save_split_manifest_identity: true
  save_optimizer: true
  save_scheduler: true
smoke:
  fixture: tests/fixtures/flat_episode.json
  expected_where: tests/fixtures/expected_where.txt
  expected_flat_target: tests/fixtures/expected_flat_target.txt
  require_finite_losses: true
  require_lora_gradient: true
  require_projector_nonzero_gradient: false
  require_end_fix_input_gradient: true
  require_end_fix_output_gradient_if_untied: true
