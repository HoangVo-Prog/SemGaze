method: semantic_sft
prompt_style: origin
semgaze_config: configs/flat_single.yaml
precision: bf16
device: cuda
epochs: 2
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
warmup_ratio: 0.10
seed: 42
save_every: 100
gradient_checkpointing: true
max_new_tokens: 512
evaluation:
  subject_scope: unseen # unseen | seen | both
metrics:
  bleu4: true
  rouge_l: true
  cider_r: true
  meteor: true
  bertscore: false
